services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reparto}
      POSTGRES_USER: ${POSTGRES_USER:-reparto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reparto_local}
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_URL: ${WEB_URL:-http://localhost:3001}
      API_URL: ${API_URL:-http://localhost:4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reparto}:${POSTGRES_PASSWORD:-reparto_local}@postgres:5432/${POSTGRES_DB:-reparto}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-local_development_auth_secret_change_for_production_2026}
      COOKIE_SECRET: ${COOKIE_SECRET:-local_development_cookie_secret_change_for_production_2026}
      ADMIN_INICIAL_CORREO: ${ADMIN_INICIAL_CORREO:-admin@local.test}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-DemoLocal!2026}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-mock}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_BUSINESS_ACCOUNT_ID: ${META_WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_BUSINESS_PORTFOLIO_ID: ${META_BUSINESS_PORTFOLIO_ID:-}
      WHATSAPP_BUSINESS_DISPLAY_NUMBER: ${WHATSAPP_BUSINESS_DISPLAY_NUMBER:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3001}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_datos:
